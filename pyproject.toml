[build-system]
requires = ["hatchling>=1.21"]
build-backend = "hatchling.build"

[project]
name = "Kuantix"
version = "0.1.0"
description = "Kuantix — 本地量化研究工作台（基于 easy-tdx 只读复用）"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Kuantix Team" }]
keywords = ["quant", "a-share", "tdx", "factor", "backtest"]

# ---------------------------------------------------------------------------
# 依赖锁定（system_design.md §6）
#   - easy-tdx 精确锁 1.20.3：上游基座只读复用（NF-1），版本漂移会破坏
#     _SECURITY_COEFFICIENTS / _detect_security_type 的 import 引用（NF-25）。
#   - pandas <3：上游硬约束，3.x 会破坏 easy-tdx 的 DataFrame 构造路径。
# ---------------------------------------------------------------------------
dependencies = [
    "easy-tdx==1.20.3",
    "pandas>=2.0,<3",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "pydantic>=2.6",
    "typer>=0.12",
    "pyarrow>=15",
    "scipy>=1.11",
    "tomli>=2.0; python_version < '3.11'",
    # 数据湖盘后增量同步调度（决策 D-1：APScheduler BackgroundScheduler，
    # cron 交易日 16:30 + misfire_grace + max_instances=1 防重入）
    "apscheduler>=3.10,<4",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.5",
]
# ML 因子可选依赖（功能4）：梯度提升树 + 深度学习 +（遗传规划纯标准库，无需依赖）
ml = [
    "lightgbm>=4.0",
    "xgboost>=2.0",
    "scikit-learn>=1.3",
    "torch>=2.1",
]

[project.scripts]
Kuantix = "Kuantix.cli:main"

[project.urls]
Homepage = "https://github.com/Kuantix/Kuantix"

[tool.hatch.build.targets.wheel]
packages = ["Kuantix"]

[tool.hatch.build.targets.wheel.force-include]
"config.toml" = "Kuantix/resources/config.default.toml"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-ra -q"
markers = [
    "network: 需要外网 TDX 行情服务器的用例（离线环境自动跳过）",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "S", "C4", "SIM"]
ignore = ["S101"]

[tool.ruff.lint.per-file-ignores]
"Kuantix/tests/*" = ["S101", "S311"]
